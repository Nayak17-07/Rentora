name: Rentora CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            server/package-lock.json
            frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Frontend Application
        working-directory: ./frontend
        run: npm run build

      - name: Install Server Dependencies
        working-directory: ./server
        run: npm ci

      - name: Verify Backend Server Integrity
        working-directory: ./server
        run: node -e "require('./src/app'); console.log('Server initialized OK');"

      - name: Install Python Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pymongo pyjwt python-dotenv

      - name: Validate Python Test Syntax
        run: |
          python -m py_compile tests/*.py
          python -m py_compile scripts/*.py

